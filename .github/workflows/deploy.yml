name: Deploy

# El deploy NO se dispara con el push: espera a que el workflow "CI" termine
# en verde sobre main. Así un commit que rompe typecheck, tests o el build de
# Docker nunca llega a producción. Backend y frontend viven en el mismo
# proyecto de Railway (servicios «backend» y «frontend»).
#
# Si se conecta además la integración GitHub de Railway, desactiva su
# auto-deploy en cada servicio para que este workflow sea la única vía y el
# gate de CI no se salte.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Escape hatch manual (re-deploy sin push, rollback, etc.)
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Gate: solo continuar si CI pasó ────────────────────────────────────────
  gate:
    name: Verify CI status
    runs-on: ubuntu-latest
    # workflow_dispatch no trae conclusion: se permite explícitamente.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI green — proceeding
        run: |
          echo "trigger=${{ github.event_name }}"
          echo "conclusion=${{ github.event.workflow_run.conclusion || 'n/a' }}"
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}"

  # ─── Deploy Backend → Railway ────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    environment: production
    needs: gate

    steps:
      - uses: actions/checkout@v4
        with:
          # Desplegar exactamente el commit que CI validó, no el HEAD actual.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli@3

      - name: Deploy to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --detach

  # ─── Deploy Frontend → Railway ───────────────────────────────────────────────
  # Va después del backend: una versión nueva del frontend puede llamar a rutas
  # que solo existen en la versión nueva del API. Las NEXT_PUBLIC_* se toman de
  # las variables del servicio «frontend» en Railway (ver frontend/railway.toml).
  deploy-frontend:
    name: Deploy Frontend → Railway
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli@3

      - name: Deploy to Railway
        working-directory: frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service frontend --detach