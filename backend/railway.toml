[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile.prod"

[deploy]
  # Migraciones ANTES de sustituir la versión en marcha: se ejecutan una sola vez
  # por deploy, sobre la imagen nueva, y si fallan el deploy se detiene sin tocar
  # la versión actual. Sin esto, `railway up` arrancaba código nuevo contra un
  # esquema viejo (TYPEORM_MIGRATIONS_RUN no está definida por defecto en Railway).
  preDeployCommand = ["npm run migration:run:prod"]
  healthcheckPath = "/health"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5

# Sin volumen: en producción los archivos van a S3 (services/StorageService.ts);
# /app/uploads solo se usa en desarrollo. El volumen se cobraba sin usarse.
#
# Worker: con menos de ~100 negocios los análisis corren dentro de este mismo
# proceso (RUN_WORKER sin definir). Para separarlos, crear un servicio «worker»
# con el comando `npm run worker:prod` y poner RUN_WORKER=false aquí.
