# Servicio «frontend» en Railway (raíz del servicio: frontend).
#
# Railway pasa las variables del servicio al build solo si el Dockerfile las
# declara con ARG (Dockerfile.prod ya declara NEXT_PUBLIC_API_URL,
# NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_APP_URL y CSP_ENFORCE). Se hornean en el
# bundle al compilar: cambiar una de ellas exige un nuevo despliegue.

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile.prod"

[deploy]
  healthcheckPath = "/"
  healthcheckTimeout = 120
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5
