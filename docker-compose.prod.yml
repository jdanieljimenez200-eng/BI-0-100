services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: bi0a100-backend:prod
    container_name: bi0a100-backend-prod
    restart: always
    ports:
      # Vinculado a localhost para que quede protegido tras un reverse proxy (Nginx, Caddy o Traefik)
      - "127.0.0.1:3001:3001"
    # Todas las variables del backend salen de .env.production (plantilla:
    # .env.production.template). Antes se copiaban una a una aquí y la lista se
    # desincronizaba del código: faltaban los precios de Stripe y las claves del
    # panel de admin, y el bucket iba con un nombre que el código no lee.
    # Si falta algo imprescindible, el backend no arranca y lo dice en el log
    # (backend/src/config/entorno.ts).
    #
    # Uso: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      # Los trabajos en segundo plano (análisis, Google Calendar) corren en el
      # servicio `worker`: así no comparten CPU con las peticiones de los usuarios
      # y desplegar la API no corta trabajos en vuelo.
      RUN_WORKER: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:${PORT:-3001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bi0a100-network

  worker:
    image: bi0a100-backend:prod
    container_name: bi0a100-worker-prod
    restart: always
    command: ["node", "dist/workers/runWorker.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    # Sin HTTP: no hay /health. El orquestador lo reinicia si el proceso sale.
    healthcheck:
      disable: true
    stop_grace_period: 60s # close() espera a que terminen los trabajos en curso
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bi0a100-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        # Errores del navegador. SENTRY_DSN (abajo) solo cubre el servidor de Next.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    image: bi0a100-frontend:prod
    container_name: bi0a100-frontend-prod
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => { if (r.statusCode >= 500) throw new Error(r.statusCode) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bi0a100-network

  # Solo para servidor propio: en Railway no se despliega (con <100 negocios
  # bastan Sentry y un monitor de disponibilidad sobre /health). Versión fija
  # LTS: `latest` cambiaba de versión mayor sin ningún commit.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: bi0a100-prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # Mismo valor que METRICS_TOKEN del backend (fuera de git, ver .gitignore):
      #   mkdir -p prometheus && printf '%s' "$METRICS_TOKEN" > prometheus/metrics_token
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=30d
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bi0a100-network

volumes:
  prometheus_data:
    driver: local

networks:
  bi0a100-network:
    driver: bridge