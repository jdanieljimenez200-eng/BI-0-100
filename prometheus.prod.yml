global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: 'production'
    service: 'bi0a100'

# Alertas
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'bi0a100-backend'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['backend:3001']
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_timestamps: true

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']